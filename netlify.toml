[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[functions]]
  name = "itinerary"
  timeout = 120

# Export pubblico: /export/<tripId> serve l'itinerario come pagina HTML (funzione serverless)
# prima del catch-all SPA, così non finisce dentro l'app React.
[[redirects]]
  from = "/export/*"
  to = "/.netlify/functions/export?id=:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
